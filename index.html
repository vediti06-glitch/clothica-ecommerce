<!DOCTYPE html>
<html>
<head>
    <title>Insert Data Test</title>
    <style>
        body {
            font-family: Arial;
            background: #f7f7f7;
            padding: 40px;
        }
        form {
            width: 300px;
            padding: 20px;
            background: white;
            border-radius: 8px;
            box-shadow: 0px 0px 10px #ccc;
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        button {
            padding: 10px;
            width: 100%;
            background: #28a745;
            border: none;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background: #218838;
        }
    </style>
</head>
<body>

<h2>Insert Data Into Database</h2>

<form action="http://localhost:3000/insert" method="POST">
    <input type="text" name="name" placeholder="Enter Name" required>
    <input type="text" name="email" placeholder="Enter Email" required>
    <button type="submit">Submit</button>
</form>

</body>
</html>
